
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Objects</title>
    <script src="script.js" defer></script>
</head>
<body>

    <h1>JavaScript Pre-defined and User-defined Objects</h1>

    <h2>1. Document Object</h2>
    <button onclick="documentExample()">Document Example</button>

    <h2>2. Window Object</h2>
    <button onclick="windowExample()">Window Example</button>

    <h2>3. Array Object</h2>
    <button onclick="arrayExample()">Array Example</button>

    <h2>4. Math Object</h2>
    <button onclick="mathExample()">Math Example</button>

    <h2>5. String Object</h2>
    <button onclick="stringExample()">String Example</button>

    <h2>6. Regular Expression Object</h2>
    <button onclick="regexExample()">Regex Example</button>

    <h2>7. Date Object</h2>
    <button onclick="dateExample()">Date Example</button>

    <h2>8. User-defined Object</h2>
    <button onclick="userObjectExample()">User Object Example</button>

    <h2>Output</h2>
    <pre id="output">Click a button to display the output.</pre>

</body>
</html>
